version: "2"

run:
  timeout: 3m
  tests: true

linters:
  enable:
  - errcheck
  - govet
  - ineffassign
  - staticcheck
  - unused
  - revive
  - misspell
  - unconvert
  - unparam
  - prealloc
  - sqlclosecheck

formatters:
  enable:
  - gofmt
  - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0