services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nesting_postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-nesting_optimizer}
    volumes:
      - nesting_pg_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-nesting_optimizer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - backend
volumes:
  nesting_pg_data:

networks:
  backend: